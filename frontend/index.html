<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospector — Prospecção Inteligente</title>
<meta name="description" content="Prospecção B2B com IA. Encontre, analise e diagnostique oportunidades de negócio.">
<meta name="theme-color" content="#6366F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="app-header" role="banner">
  <a class="app-logo" href="/" aria-label="Prospector — Página inicial">
    <div class="app-logo-icon" aria-hidden="true">🔍</div>
    <div>
      <div class="app-logo-text">Prospector</div>
      <div class="app-logo-sub">Prospecção Inteligente com IA</div>
    </div>
  </a>
  <div class="header-actions">
    <button class="btn btn-secondary btn-sm" onclick="Prospector.loadHistory()" aria-label="Atualizar histórico">🔄 Atualizar</button>
  </div>
</header>

<main class="container" role="main">

  <!-- ═══ SEARCH FORM ═══ -->
  <section class="card" style="margin-bottom: var(--sp-6);" aria-label="Formulário de busca">
    <div class="card-header">
      <span class="card-icon" aria-hidden="true">🔎</span>
      <h2 class="card-title">Buscar Empresas</h2>
    </div>
    <div class="search-row" style="display:flex;gap:var(--sp-3);flex-wrap:wrap;">
      <div class="form-group" style="flex:2;min-width:200px">
        <label class="form-label" for="niche">Nicho</label>
        <input type="text" id="niche" class="form-input" placeholder="Ex: clínicas de estética" autocomplete="off">
      </div>
      <div class="form-group" style="flex:2;min-width:180px">
        <label class="form-label" for="city">Cidade</label>
        <input type="text" id="city" class="form-input" placeholder="Ex: Cascavel" autocomplete="off">
      </div>
      <div class="form-group" style="flex:1;min-width:100px">
        <label class="form-label" for="state">Estado</label>
        <select id="state" class="form-select">
          <option value="PR">PR</option><option value="SC">SC</option><option value="RS">RS</option>
          <option value="SP">SP</option><option value="MG">MG</option><option value="RJ">RJ</option>
          <option value="ES">ES</option><option value="MS">MS</option><option value="MT">MT</option>
          <option value="GO">GO</option><option value="DF">DF</option><option value="BA">BA</option>
          <option value="CE">CE</option><option value="PE">PE</option><option value="AM">AM</option>
          <option value="PA">PA</option><option value="MA">MA</option><option value="PB">PB</option>
          <option value="RN">RN</option><option value="AL">AL</option><option value="PI">PI</option>
          <option value="SE">SE</option><option value="TO">TO</option><option value="RO">RO</option>
          <option value="AC">AC</option><option value="AP">AP</option><option value="RR">RR</option>
        </select>
      </div>
      <div class="form-group" style="flex:0 0 auto;align-self:flex-end">
        <button class="btn btn-primary btn-lg" id="searchBtn" onclick="Prospector.doSearch()">🔍 Descobrir</button>
      </div>
    </div>
  </section>

  <!-- ═══ LOADING ═══ -->
  <div class="loading-overlay" id="loading" role="alert" aria-live="polite">
    <div class="loading-content">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadingText">Buscando empresas...</p>
      <p class="progress-text" id="progressText"></p>
    </div>
  </div>

  <!-- ═══ RESULTS ═══ -->
  <section class="results" id="results" style="display:none" aria-label="Resultados da busca">
    <div class="pipeline-bar" id="pipelineBar" role="navigation" aria-label="Progresso do pipeline"></div>
    <div class="pipeline-stats" id="pipelineStats" role="status"></div>
    <div class="actions-bar" id="actionsBar"></div>
    <div class="summary-grid" id="summaryGrid" role="region" aria-label="Resumo estatístico"></div>
    <div class="ia-box" id="iaMarketAnalysis" style="display:none" aria-label="Análise de mercado por IA">
      <h3>📊 Análise de Mercado</h3>
      <div id="iaMarketText"></div>
    </div>
    <div id="filtersContainer"></div>
    <div class="lead-list" id="leadList" role="list" aria-label="Lista de leads"></div>
  </section>

  <!-- ═══ DIAGNOSIS MODAL ═══ -->
  <div class="modal-overlay" id="diagModal" role="dialog" aria-modal="true" aria-label="Diagnóstico do lead">
    <div class="modal-content" id="diagContent">
      <button class="modal-close" onclick="Prospector.closeDiagModal()" aria-label="Fechar modal">✕</button>
      <div id="diagBody">Carregando...</div>
    </div>
  </div>

  <!-- ═══ HISTORY ═══ -->
  <section class="history-section" id="historySection" aria-label="Buscas anteriores">
    <h2 style="margin-bottom:var(--sp-3)">📋 Buscas Anteriores</h2>
    <div id="historyList" role="list"></div>
  </section>

</main>

<!-- ═══ TOAST CONTAINER ═══ -->
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<!-- ═══ MODULE SCRIPTS ═══ -->
<script type="module" src="/js/app.js"></script>

<!-- ═══ SERVICE WORKER REGISTRATION ═══ -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('SW registrado:', reg.scope))
        .catch(err => console.warn('SW registro falhou:', err));
    });
  }
</script>

</body>
</html>
