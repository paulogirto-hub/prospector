<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospector — Prospecção Inteligente</title>
<meta name="description" content="Prospecção B2B com IA. Encontre, analise e diagnostique oportunidades de negócio.">
<style>
/* ═══════════════════════════════════════════════════
   PROSPECTOR DESIGN SYSTEM v2.0
   Based on FRONT-30 / Meta-Framework
   ═══════════════════════════════════════════════════ */

/* ─── Reset ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ─── Design Tokens ─── */
:root {
  /* Slate (base) — dark theme */
  --bg:         #0B0F19;
  --bg-raised:  #111827;
  --bg-card:    #1E293B;
  --bg-input:   #0F172A;
  --border:     #334155;
  --border-hover: #475569;

  /* Brand (primary) */
  --brand-50:   #EEF2FF;
  --brand-100:  #E0E7FF;
  --brand-200:  #C7D2FE;
  --brand-300:  #A5B4FC;
  --brand-400:  #818CF8;
  --brand-500:  #6366F1;
  --brand-600:  #4F46E5;
  --brand-700:  #4338CA;

  /* Accent (teal) */
  --accent:     #06B6D4;
  --accent2:    #14B8A6;

  /* Semantic */
  --success:    #10B981;
  --success-bg: rgba(16,185,129,0.12);
  --warning:    #F59E0B;
  --warning-bg: rgba(245,158,11,0.12);
  --error:      #EF4444;
  --error-bg:   rgba(239,68,68,0.12);
  --info:       #3B82F6;
  --info-bg:    rgba(59,130,246,0.12);

  /* Text */
  --text:       #F1F5F9;
  --text2:      #94A3B8;
  --text3:      #64748B;

  /* Typography */
  --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;

  /* Spacing */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;  --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px;  --sp-10: 40px;
  --sp-12: 48px;

  /* Radius */
  --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-xl: 16px; --r-full: 9999px;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 15px rgba(0,0,0,0.5);
  --shadow-xl: 0 20px 25px rgba(0,0,0,0.6);

  /* Transitions */
  --tr-fast: 150ms ease;
  --tr-base: 200ms ease;
  --tr-slow: 300ms ease;
}

/* ─── Base ─── */
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 2px; border-radius: var(--r-sm); }
button:focus-visible { outline: 2px solid var(--brand-500); outline-offset: 2px; }
::selection { background: var(--brand-600); color: white; }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--r-full); }
::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

/* ═══════════════════════════════════════════════════
   COMPONENTS
   ═══════════════════════════════════════════════════ */

/* ─── Header ─── */
.app-header {
  background: var(--bg-raised);
  border-bottom: 1px solid var(--border);
  padding: var(--sp-4) var(--sp-6);
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.app-logo {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  text-decoration: none;
}
.app-logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--brand-500), var(--accent));
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.app-logo-text {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--brand-400), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.app-logo-sub {
  color: var(--text3);
  font-size: 12px;
  font-weight: 400;
}
.header-actions {
  margin-left: auto;
  display: flex;
  gap: var(--sp-2);
}

/* ─── Container ─── */
.container { max-width: 1400px; margin: 0 auto; padding: var(--sp-6); }

/* ─── Card ─── */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-5);
  transition: border-color var(--tr-fast);
}
.card:hover { border-color: var(--border-hover); }
.card-header {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}
.card-title { font-size: 16px; font-weight: 600; }
.card-icon { font-size: 20px; }

/* ─── Buttons ─── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--sp-2);
  padding: 10px 20px;
  border: none;
  border-radius: var(--r-md);
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-sans);
  cursor: pointer;
  transition: all var(--tr-fast);
  white-space: nowrap;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }
.btn-primary {
  background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
  color: white;
}
.btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(99,102,241,0.4); }
.btn-secondary {
  background: var(--bg-raised);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover:not(:disabled) { border-color: var(--brand-400); color: var(--brand-400); }
.btn-danger { background: var(--error-bg); color: var(--error); border: 1px solid rgba(239,68,68,0.3); }
.btn-danger:hover:not(:disabled) { background: rgba(239,68,68,0.2); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 14px 28px; font-size: 16px; }
.btn-icon { padding: 8px; border-radius: var(--r-md); min-width: 36px; }
.btn-step {
  padding: 8px 16px;
  border: none;
  border-radius: var(--r-md);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--tr-fast);
  color: white;
}
.btn-step:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-step:hover:not(:disabled) { transform: translateY(-1px); }
.btn-enrich { background: linear-gradient(135deg, #2563EB, #3B82F6); }
.btn-score { background: linear-gradient(135deg, #D97706, #F59E0B); color: #1E293B; }
.btn-market { background: linear-gradient(135deg, var(--brand-600), var(--brand-400)); }
.btn-leads { background: linear-gradient(135deg, var(--accent2), var(--success)); color: #1E293B; }
.btn-all { background: linear-gradient(135deg, var(--success), #34D399); color: #1E293B; font-size: 14px; padding: 10px 24px; }
.btn-run-pipeline {
  background: linear-gradient(135deg, var(--brand-500), var(--accent));
  color: white;
  font-size: 15px;
  padding: 12px 32px;
  border: none;
  border-radius: var(--r-lg);
  font-weight: 700;
  cursor: pointer;
  transition: all var(--tr-base);
}
.btn-run-pipeline:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 24px rgba(99,102,241,0.4); }

/* ─── Form Inputs ─── */
.form-group { display: flex; flex-direction: column; gap: var(--sp-1); }
.form-label { font-size: 13px; font-weight: 500; color: var(--text2); }
.form-input, .form-select {
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text);
  font-size: 15px;
  font-family: var(--font-sans);
  transition: border-color var(--tr-fast), box-shadow var(--tr-fast);
  outline: none;
  width: 100%;
}
.form-input:focus, .form-select:focus {
  border-color: var(--brand-500);
  box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
}
.form-input::placeholder { color: var(--text3); }
.form-select { cursor: pointer; }
.form-select option { background: var(--bg-card); color: var(--text); }

/* ─── Pipeline Status Bar ─── */
.pipeline-bar {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-4);
  flex-wrap: wrap;
}
.step-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 14px;
  border-radius: var(--r-full);
  font-size: 13px;
  font-weight: 600;
  transition: all var(--tr-fast);
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text3);
}
.step-pill:hover { border-color: var(--brand-400); }
.step-pill.done {
  background: var(--success-bg);
  border-color: var(--success);
  color: var(--success);
}
.step-pill.active {
  background: rgba(99,102,241,0.15);
  border-color: var(--brand-500);
  color: var(--brand-400);
  animation: pulse-glow 2s ease-in-out infinite;
}
@keyframes pulse-glow {
  0%,100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.3); }
  50% { box-shadow: 0 0 12px 2px rgba(99,102,241,0.2); }
}
.step-arrow { color: var(--text3); font-size: 14px; }
.pipeline-stats {
  font-size: 12px;
  color: var(--text2);
  padding: var(--sp-2) var(--sp-3);
  background: rgba(99,102,241,0.08);
  border-radius: var(--r-md);
  margin-bottom: var(--sp-4);
}

/* ─── Actions Bar ─── */
.actions-bar {
  display: flex;
  gap: var(--sp-2);
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: var(--sp-5);
}
.actions-bar .spacer { flex: 1; }

/* ─── Summary Grid ─── */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: var(--sp-3);
  margin-bottom: var(--sp-5);
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-4);
  text-align: center;
  transition: border-color var(--tr-fast), transform var(--tr-fast);
}
.stat-card:hover { border-color: var(--brand-400); transform: translateY(-2px); }
.stat-card .num {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.stat-card .label {
  font-size: 11px;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-top: var(--sp-1);
}
.stat-card.green .num { color: var(--success); }
.stat-card.red .num { color: var(--error); }
.stat-card.yellow .num { color: var(--warning); }
.stat-card.blue .num { color: var(--info); }
.stat-card.purple .num { color: var(--brand-400); }
.stat-card.teal .num { color: var(--accent); }

/* ─── Lead Cards ─── */
.lead-list {
  display: flex;
  flex-direction: column;
  gap: var(--sp-3);
}
.lead-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-4) var(--sp-5);
  transition: all var(--tr-fast);
  cursor: pointer;
}
.lead-card:hover { border-color: var(--brand-500); box-shadow: var(--shadow-sm); }
.lead-card.open .lead-detail { display: block; }
.lead-card:not(.open) .lead-detail { display: none; }
.lead-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--sp-2);
}
.lead-name {
  font-size: 15px;
  font-weight: 600;
  flex: 1;
  line-height: 1.4;
}
.lead-name:hover { color: var(--brand-400); }
.lead-actions {
  display: flex;
  gap: 4px;
  margin-left: var(--sp-2);
}
.lead-actions button {
  background: none;
  border: none;
  font-size: 16px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: var(--r-sm);
  transition: background var(--tr-fast);
}
.lead-actions button:hover { background: rgba(255,255,255,0.08); }
.lead-score {
  font-size: 13px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: var(--r-full);
  white-space: nowrap;
}
.lead-score.high { background: var(--success-bg); color: var(--success); }
.lead-score.mid { background: var(--warning-bg); color: var(--warning); }
.lead-score.low { background: var(--error-bg); color: var(--error); }
.lead-badges {
  display: flex;
  gap: var(--sp-1);
  flex-wrap: wrap;
  margin-top: var(--sp-2);
}
.badge {
  padding: 3px 8px;
  border-radius: var(--r-sm);
  font-size: 11px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.badge-site { background: var(--info-bg); color: var(--info); }
.badge-insta { background: rgba(225,48,107,0.12); color: #E1306C; }
.badge-maps { background: rgba(6,182,212,0.12); color: var(--accent); }
.badge-ads { background: var(--warning-bg); color: var(--warning); }
.badge-no { background: rgba(100,116,139,0.1); color: var(--text3); }
.badge-email { background: var(--success-bg); color: var(--success); }
.badge-phone { background: var(--info-bg); color: var(--info); }
.badge-youtube { background: rgba(239,68,68,0.12); color: #FF0000; }
.badge-tiktok { background: rgba(225,48,107,0.12); color: #FF0050; }
.badge-enrich { background: rgba(99,102,241,0.1); color: var(--brand-400); font-size: 10px; }
.badge-cnpj-src { background: rgba(6,182,212,0.1); color: var(--accent); font-size: 10px; }
.badge-diag { background: rgba(6,182,212,0.15); color: var(--accent2); }
.badge-analise { background: rgba(99,102,241,0.15); color: var(--brand-400); }
.lead-snippet { color: var(--text2); font-size: 13px; margin-top: var(--sp-1); line-height: 1.5; }
.lead-detail {
  margin-top: var(--sp-3);
  padding-top: var(--sp-3);
  border-top: 1px solid var(--border);
}
.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-2) var(--sp-4);
  font-size: 13px;
}
.detail-grid dt { color: var(--text3); font-weight: 500; }
.detail-grid dd { font-weight: 500; }
.detail-grid dd a { color: var(--accent); }

/* ─── IA Analysis Box ─── */
.ia-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-5);
  margin-bottom: var(--sp-5);
  line-height: 1.7;
}
.ia-box h3 {
  color: var(--accent2);
  margin-bottom: var(--sp-3);
  font-size: 16px;
}
.ia-lead {
  margin-top: var(--sp-3);
  background: rgba(99,102,241,0.06);
  border-radius: var(--r-md);
  padding: var(--sp-3);
  font-size: 13px;
  line-height: 1.6;
}
.ia-lead textarea {
  width: 100%;
  min-height: 100px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 13px;
  padding: var(--sp-2);
  resize: vertical;
  margin-top: var(--sp-2);
}
.ia-lead textarea:focus { border-color: var(--brand-500); outline: none; }
.ia-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-2); }
.ia-actions button {
  padding: 6px 14px;
  border: none;
  border-radius: var(--r-md);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--tr-fast);
}
.btn-save { background: var(--success); color: #1E293B; }
.btn-save:hover { opacity: 0.85; }
.btn-reanalyze { background: var(--brand-500); color: white; }
.btn-reanalyze:hover { opacity: 0.85; }

/* ─── Analysis Fields ─── */
.analysis-section {
  background: rgba(99,102,241,0.05);
  border: 1px solid rgba(99,102,241,0.12);
  border-radius: var(--r-lg);
  padding: var(--sp-4);
  margin-top: var(--sp-2);
}
.analysis-field { margin-bottom: var(--sp-3); }
.analysis-field .af-label {
  font-size: 11px;
  color: var(--text3);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}
.analysis-field .af-value { font-size: 14px; line-height: 1.6; }

/* ─── Market Analysis ─── */
.market-section { margin-bottom: var(--sp-3); }
.market-section .ms-label {
  font-size: 11px;
  color: var(--text3);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}
.market-section .ms-value { font-size: 14px; line-height: 1.6; }
.market-opp-list { list-style: none; padding: 0; }
.market-opp-list li {
  padding: var(--sp-2) var(--sp-3);
  margin-bottom: var(--sp-2);
  background: rgba(6,182,212,0.06);
  border-radius: var(--r-md);
  border-left: 3px solid var(--accent2);
}
.market-opp-list .opp-title { font-weight: 600; }
.market-opp-list .opp-desc { font-size: 12px; color: var(--text2); }
.market-opp-list .opp-pot { font-size: 11px; font-weight: 600; }
.market-opp-list .opp-pot.alto { color: var(--success); }
.market-opp-list .opp-pot.medio { color: var(--warning); }
.market-opp-list .opp-pot.baixo { color: var(--error); }

/* ─── Edit Form ─── */
.edit-form {
  background: rgba(99,102,241,0.05);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--sp-3);
  margin-top: var(--sp-2);
  font-size: 13px;
}
.edit-form label { display: block; color: var(--text2); margin-top: var(--sp-2); font-size: 12px; }
.edit-form input {
  width: 100%;
  padding: 6px 10px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  color: var(--text);
  font-size: 13px;
  margin-top: 3px;
}
.edit-form input:focus { border-color: var(--brand-500); outline: none; }
.edit-form .edit-actions { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); }
.edit-form .edit-actions button {
  padding: 6px 14px; border: none; border-radius: var(--r-md);
  font-size: 12px; font-weight: 600; cursor: pointer;
}
.btn-save-edit { background: var(--success); color: #1E293B; }
.btn-cancel-edit { background: var(--text3); color: var(--bg); }

/* ─── History ─── */
.history-section { margin-top: var(--sp-8); }
.history-section h2 { margin-bottom: var(--sp-3); }
.history-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-4);
  margin-bottom: var(--sp-2);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: all var(--tr-fast);
}
.history-item:hover { border-color: var(--brand-500); background: var(--bg-raised); }
.history-item .hi-info { flex: 1; }
.history-item .hi-niche { font-weight: 600; }
.history-item .hi-location { color: var(--text2); font-size: 13px; }
.history-item .hi-right { display: flex; align-items: center; gap: var(--sp-2); }
.btn-del-search {
  background: none; border: none; font-size: 18px; cursor: pointer;
  opacity: 0.4; transition: opacity var(--tr-fast);
}
.btn-del-search:hover { opacity: 1; }
.status-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: var(--r-full);
  font-weight: 600;
}
.status-badge.discovery, .status-badge.discovering { background: rgba(99,102,241,0.15); color: var(--brand-400); }
.status-badge.enriching, .status-badge.enriched { background: var(--info-bg); color: var(--info); }
.status-badge.scored { background: var(--warning-bg); color: var(--warning); }
.status-badge.market_analyzed, .status-badge.analyzing_market { background: rgba(99,102,241,0.15); color: var(--brand-400); }
.status-badge.analyzing_leads, .status-badge.analyzed { background: rgba(20,184,166,0.15); color: var(--accent2); }

/* ─── Loading ─── */
.loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(11,15,25,0.85);
  z-index: 500;
  justify-content: center;
  align-items: center;
  backdrop-filter: blur(4px);
}
.loading-overlay.show { display: flex; }
.loading-content {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  padding: var(--sp-8) var(--sp-10);
  text-align: center;
  max-width: 420px;
  width: 90%;
}
.spinner {
  width: 44px; height: 44px;
  border: 3px solid var(--border);
  border-top-color: var(--brand-500);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto var(--sp-4);
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-content p { color: var(--text2); font-size: 14px; }
.loading-content .progress-text { color: var(--brand-400); font-weight: 600; margin-top: var(--sp-2); }

/* ─── Modal ─── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(11,15,25,0.8);
  z-index: 1000;
  justify-content: center;
  align-items: flex-start;
  padding: var(--sp-5);
  overflow-y: auto;
  backdrop-filter: blur(4px);
}
.modal-overlay.show { display: flex; }
.modal-content {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-xl);
  width: 100%;
  max-width: 800px;
  max-height: 90vh;
  overflow-y: auto;
  padding: var(--sp-7);
  position: relative;
  margin-top: var(--sp-5);
  box-shadow: var(--shadow-xl);
}
.modal-close {
  position: absolute;
  top: var(--sp-3);
  right: var(--sp-4);
  background: none;
  border: none;
  color: var(--text2);
  font-size: 24px;
  cursor: pointer;
  padding: var(--sp-2);
  border-radius: var(--r-md);
  transition: all var(--tr-fast);
  z-index: 10;
}
.modal-close:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.modal-header { margin-bottom: var(--sp-5); padding-right: 36px; }
.modal-header h2 { font-size: 22px; margin-bottom: var(--sp-1); }
.modal-header .modal-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: var(--sp-2); }
.modal-header .modal-score { font-size: 18px; font-weight: 700; padding: 4px 14px; border-radius: var(--r-full); }
.modal-section { margin-bottom: var(--sp-5); }
.modal-section h3 {
  font-size: 16px;
  margin-bottom: var(--sp-3);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.modal-cadastro {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-2);
  font-size: 13px;
}
.modal-cadastro dt { color: var(--text2); }
.modal-cadastro dd { font-weight: 500; }

/* ─── Diagnosis Cards ─── */
.diag-fracos-card {
  background: var(--error-bg);
  border: 1px solid rgba(239,68,68,0.15);
  border-radius: var(--r-md);
  padding: var(--sp-3);
  margin-bottom: var(--sp-2);
}
.diag-fracos-card .dfc-ponto { font-weight: 600; color: var(--error); font-size: 14px; }
.diag-fracos-card .dfc-detail { font-size: 13px; color: var(--text2); margin-top: 2px; }
.diag-fracos-card .dfc-detail span { display: inline-block; margin-right: var(--sp-3); }
.diag-fracos-card .dfc-solucao { font-size: 13px; color: var(--accent2); font-weight: 600; margin-top: 2px; }
.diag-fortes-card {
  background: var(--success-bg);
  border: 1px solid rgba(16,185,129,0.15);
  border-radius: var(--r-md);
  padding: var(--sp-3);
  margin-bottom: var(--sp-2);
}
.diag-fortes-card .dfc-ponto { font-weight: 600; color: var(--success); font-size: 14px; }
.diag-fortes-card .dfc-detail { font-size: 13px; color: var(--text2); margin-top: 2px; }
.diag-fortes-card .dfc-como { font-size: 13px; color: var(--accent2); font-weight: 600; margin-top: 2px; }
.opp-principal-card {
  background: var(--bg);
  border: 2px solid var(--accent2);
  border-radius: var(--r-lg);
  padding: var(--sp-4);
  margin: var(--sp-3) 0;
}
.opp-principal-card .opp-title { font-size: 18px; font-weight: 700; color: var(--accent2); margin-bottom: var(--sp-3); }
.opp-principal-card .opp-details { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--sp-2); }
.opp-principal-card .opp-item { font-size: 13px; }
.opp-principal-card .opp-item .oi-label { color: var(--text3); font-size: 11px; }
.opp-principal-card .opp-item .oi-value { font-weight: 700; font-size: 15px; color: var(--success); }
.urgency-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: var(--r-full);
  font-weight: 700;
  font-size: 14px;
}
.urgency-badge.alta { background: rgba(239,68,68,0.2); color: var(--error); }
.urgency-badge.media { background: var(--warning-bg); color: var(--warning); }
.urgency-badge.baixa { background: var(--success-bg); color: var(--success); }
.diag-abordagem {
  background: rgba(6,182,212,0.06);
  border: 1px solid rgba(6,182,212,0.15);
  border-radius: var(--r-md);
  padding: var(--sp-3);
  font-size: 14px;
  line-height: 1.6;
  position: relative;
  white-space: pre-wrap;
}
.diag-abordagem .copy-btn {
  position: absolute;
  top: var(--sp-2);
  right: var(--sp-2);
  background: var(--accent2);
  color: var(--bg);
  border: none;
  border-radius: var(--r-md);
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
  font-weight: 600;
  transition: opacity var(--tr-fast);
}
.diag-abordagem .copy-btn:hover { opacity: 0.8; }
.diag-receita { font-size: 20px; font-weight: 700; color: var(--success); margin-top: var(--sp-1); }
.diag-generate-btn {
  width: 100%;
  padding: var(--sp-4);
  background: linear-gradient(135deg, var(--brand-500), var(--accent));
  color: white;
  border: none;
  border-radius: var(--r-lg);
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all var(--tr-base);
  margin: var(--sp-4) 0;
}
.diag-generate-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
.diag-generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.modal-actions {
  display: flex;
  gap: var(--sp-2);
  flex-wrap: wrap;
  margin-top: var(--sp-4);
  padding-top: var(--sp-4);
  border-top: 1px solid var(--border);
}
.btn-action {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all var(--tr-fast);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
}
.btn-action:hover { border-color: var(--brand-500); color: var(--brand-400); }
.btn-action.danger { color: var(--error); }
.btn-action.danger:hover { border-color: var(--error); }
.loading-diag { text-align: center; padding: var(--sp-10); }

/* ─── Empty State ─── */
.empty-state {
  text-align: center;
  padding: var(--sp-12) var(--sp-6);
  color: var(--text2);
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: var(--sp-4); }
.empty-state .empty-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: var(--sp-2); }
.empty-state .empty-desc { font-size: 14px; max-width: 400px; margin: 0 auto; }

/* ─── Toast ─── */
.toast-container {
  position: fixed;
  top: var(--sp-5);
  right: var(--sp-5);
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
}
.toast {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-3) var(--sp-4);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  font-size: 14px;
  box-shadow: var(--shadow-lg);
  animation: slideInRight 0.3s ease;
  max-width: 360px;
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--error); }
.toast.warning { border-left: 3px solid var(--warning); }
.toast.info { border-left: 3px solid var(--info); }
@keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

/* ─── Responsive ─── */
@media (max-width: 768px) {
  .app-header { padding: var(--sp-3) var(--sp-4); }
  .app-logo-sub { display: none; }
  .container { padding: var(--sp-4); }
  .search-row { flex-direction: column; }
  .search-row .form-group { min-width: 100%; }
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  .detail-grid { grid-template-columns: 1fr; }
  .modal-cadastro { grid-template-columns: 1fr; }
  .actions-bar { flex-direction: column; align-items: stretch; }
  .actions-bar .spacer { display: none; }
  .pipeline-bar { gap: var(--sp-1); }
  .step-pill { padding: 4px 8px; font-size: 11px; }
  .modal-content { padding: var(--sp-4); margin-top: 0; }
  .lead-card { padding: var(--sp-3); }
  .diag-oportunidades { grid-template-columns: 1fr !important; }
}

@media (max-width: 480px) {
  .summary-grid { grid-template-columns: 1fr 1fr; }
  .stat-card .num { font-size: 22px; }
  .header-actions { display: none; }
}

/* ─── Reduced Motion ─── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .step-pill.active { animation: none; }
}
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="app-header" role="banner">
  <a class="app-logo" href="/" aria-label="Prospector — Página inicial">
    <div class="app-logo-icon" aria-hidden="true">🔍</div>
    <div>
      <div class="app-logo-text">Prospector</div>
      <div class="app-logo-sub">Prospecção Inteligente com IA</div>
    </div>
  </a>
  <div class="header-actions">
    <button class="btn btn-secondary btn-sm" onclick="loadHistory()" aria-label="Atualizar histórico">🔄 Atualizar</button>
  </div>
</header>

<main class="container" role="main">

  <!-- ═══ SEARCH FORM ═══ -->
  <section class="card" style="margin-bottom: var(--sp-6);" aria-label="Formulário de busca">
    <div class="card-header">
      <span class="card-icon" aria-hidden="true">🔎</span>
      <h2 class="card-title">Buscar Empresas</h2>
    </div>
    <div class="search-row" style="display:flex;gap:var(--sp-3);flex-wrap:wrap;">
      <div class="form-group" style="flex:2;min-width:200px">
        <label class="form-label" for="niche">Nicho</label>
        <input type="text" id="niche" class="form-input" placeholder="Ex: clínicas de estética" autocomplete="off">
      </div>
      <div class="form-group" style="flex:2;min-width:180px">
        <label class="form-label" for="city">Cidade</label>
        <input type="text" id="city" class="form-input" placeholder="Ex: Cascavel" autocomplete="off">
      </div>
      <div class="form-group" style="flex:1;min-width:100px">
        <label class="form-label" for="state">Estado</label>
        <select id="state" class="form-select">
          <option value="PR">PR</option><option value="SC">SC</option><option value="RS">RS</option>
          <option value="SP">SP</option><option value="MG">MG</option><option value="RJ">RJ</option>
          <option value="ES">ES</option><option value="MS">MS</option><option value="MT">MT</option>
          <option value="GO">GO</option><option value="DF">DF</option><option value="BA">BA</option>
          <option value="CE">CE</option><option value="PE">PE</option><option value="AM">AM</option>
          <option value="PA">PA</option><option value="MA">MA</option><option value="PB">PB</option>
          <option value="RN">RN</option><option value="AL">AL</option><option value="PI">PI</option>
          <option value="SE">SE</option><option value="TO">TO</option><option value="RO">RO</option>
          <option value="AC">AC</option><option value="AP">AP</option><option value="RR">RR</option>
        </select>
      </div>
      <div class="form-group" style="flex:0 0 auto;align-self:flex-end">
        <button class="btn btn-primary btn-lg" id="searchBtn" onclick="doSearch()">🔍 Descobrir</button>
      </div>

  </section>

  <!-- ═══ LOADING ═══ -->
  <div class="loading-overlay" id="loading" role="alert" aria-live="polite">

      <div class="spinner" aria-hidden="true"></div>

  </div>

  <!-- ═══ RESULTS ═══ -->
  <section class="results" id="results" style="display:none" aria-label="Resultados da busca">
    <div class="pipeline-bar" id="pipelineBar" role="navigation" aria-label="Progresso do pipeline"></div>
    <div class="pipeline-stats" id="pipelineStats" role="status"></div>
    <div class="actions-bar" id="actionsBar"></div>
    <div class="summary-grid" id="summaryGrid" role="region" aria-label="Resumo estatístico"></div>
    <div class="ia-box" id="iaMarketAnalysis" style="display:none" aria-label="Análise de mercado por IA">
      <h3>📊 Análise de Mercado</h3>
      <div id="iaMarketText"></div>
    </div>
    <div class="lead-list" id="leadList" role="list" aria-label="Lista de leads"></div>
  </section>

  <!-- ═══ DIAGNOSIS MODAL ═══ -->
  <div class="modal-overlay" id="diagModal" role="dialog" aria-modal="true" aria-label="Diagnóstico do lead">
    <div class="modal-content" id="diagContent">
      <button class="modal-close" onclick="closeDiagModal()" aria-label="Fechar modal">✕</button>
      <div id="diagBody">Carregando...</div>
    </div>
  </div>

  <!-- ═══ HISTORY ═══ -->
  <section class="history-section" id="historySection" aria-label="Buscas anteriores">
    <h2 style="margin-bottom:var(--sp-3)">📋 Buscas Anteriores</h2>
    <div id="historyList" role="list"></div>
  </section>

</main>

<!-- ═══ TOAST CONTAINER ═══ -->
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script>
/* ═══════════════════════════════════════════════════
   PROSPECTOR SPA — Vanilla JS
   ═══════════════════════════════════════════════════ */

const API = window.location.origin;

// ─── Toast Notifications ───

function showToast(message, type = 'info', duration = 4000) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  toast.innerHTML = `<span>${icons[type] || ''}</span><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'slideOutRight 0.3s ease forwards';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

// ─── Safe Fetch ───

async function safeFetch(url, opts = {}) {
  try {
    const r = await fetch(url, opts);
    if (!r.ok) {
      let msg = `HTTP ${r.status}`;
      try { const j = await r.json(); msg = (j.error && j.error.message) || j.error || msg; } catch(_){}
      throw new Error(msg);
    }
    const text = await r.text();
    if (!text) throw new Error('Resposta vazia do servidor');
    try {
      const parsed = JSON.parse(text);
      // Handle API v2 error envelope {success: false, error: {...}}
      if (parsed && parsed.success === false && parsed.error) {
        const errMsg = (parsed.error && parsed.error.message) || parsed.error || 'Erro desconhecido';
        throw new Error(errMsg);
      }
      // Unwrap {success, data} envelope from API v2
      if (parsed && parsed.success === true && 'data' in parsed) {
        return parsed.data;
      }
      return parsed;
    } catch(e) {
      if (e.message && !e.message.includes('Servidor')) throw e;
      throw new Error('Servidor retornou resposta inválida. Tente novamente.');
    }
  } catch (e) {
    if (e.name === 'TypeError' && e.message.includes('fetch')) {
      throw new Error('Erro de conexão com o servidor. Verifique se está online.');
    }
    throw e;
  }
}

// ─── State ───

let currentSearchId = null;
let currentStatus = null;
let pipelineRunning = false;
let currentData = null;

const STEPS = ['discovery', 'enriched', 'scored', 'market_analyzed', 'analyzed', 'diagnosed'];
const STEP_LABELS = {
  discovery: 'Descoberta', discovering: 'Descoberta', enriched: 'CNPJ', scored: 'Scores',
  market_analyzed: 'Mercado', analyzed: 'Leads', analyzing_leads: 'Análise Leads',
  enriching: 'CNPJ', diagnosed: 'Diagnóstico'
};
const STEP_ICONS = {
  discovery: '🔍', discovering: '🔍', enriched: '📋', scored: '⭐',
  market_analyzed: '📊', analyzed: '🧠', analyzing_leads: '🧠',
  enriching: '📋', diagnosed: '🔬'
};
const STEP_API = {
  discovery: 'rediscover', enriched: 'enrich', scored: 'score',
  market_analyzed: 'analyze-market', analyzed: 'analyze-leads'
};

function getStepIndex(status) {
  if (status === 'enriching') return 0;
  if (status === 'discovering') return -1;
  if (status === 'analyzing_leads') return 3;
  const idx = STEPS.indexOf(status);
  return idx >= 0 ? idx : -1;
}

function getNextStep(status) {
  if (status === 'discovering') return null;
  if (status === 'discovery' || status === 'enriching') return 'enrich';
  if (status === 'enriched') return 'score';
  if (status === 'scored') return 'analyze-market';
  if (status === 'market_analyzed' || status === 'analyzing_leads') return 'analyze-leads';
  return null;
}

// ─── Pipeline Bar ───

function renderPipelineBar(status) {
  const bar = document.getElementById('pipelineBar');
  let doneUpTo = getStepIndex(status);
  let html = '';
  STEPS.forEach((step, i) => {
    if (i > 0) html += '<span class="step-arrow" aria-hidden="true">→</span>';
    const isDone = i <= doneUpTo;
    const isActive = (status === 'discovering' && i === 0);
    const cls = isDone ? 'done' : (isActive ? 'active' : 'pending');
    const label = STEP_LABELS[step] || step;
    const icon = STEP_ICONS[step] || '';
    html += `<span class="step-pill ${cls}" role="button" tabindex="0" 
      onclick="rerunStep(${i})" onkeydown="if(event.key==='Enter')rerunStep(${i})"
      title="Repetir: ${label}" aria-label="${label}${isDone ? ' (concluído)' : ''}">${icon} ${label}${isDone ? ' 🔄' : ''}</span>`;
  });
  bar.innerHTML = html;
}

function rerunStep(stepIndex) {
  const searchId = currentSearchId;
  if (!searchId) return;
  const stepKey = STEPS[stepIndex];
  const apiAction = STEP_API[stepKey];
  if (!apiAction) return;
  if (!confirm(`Repetir etapa "${STEP_LABELS[stepKey]}"? Os dados serão atualizados.`)) return;
  rerunStepApi(searchId, apiAction, stepKey);
}

async function rerunStepApi(searchId, apiAction, stepKey) {
  disableActions();
  showLoading('Atualizando...');
  const msgs = {
    rediscover: 'Atualizando descoberta...', enrich: 'Atualizando enriquecimento...',
    score: 'Atualizando scores...', 'analyze-market': 'Atualizando análise de mercado...',
    'analyze-leads': 'Atualizando análise de leads...'
  };
  setProgress(msgs[apiAction] || 'Atualizando...');
  try {
    const data = await safeFetch(API + `/api/search/${searchId}/${apiAction}`, { method: 'POST' });
    if (data.error) { showToast(data.error, 'error'); return; }
    if (data.status === 'enriching' || data.status === 'discovering') {
      if (data.status === 'enriching') await pollEnrichProgress(searchId);
      else if (data.status === 'discovering') await pollDiscoveryProgress(searchId);
      const updated = await safeFetch(API + `/api/search/${searchId}`);
      currentStatus = updated.status; currentData = updated; renderResults(updated);
    } else if (data.status === 'analyzing_leads') {
      await pollAnalyzeLeadsProgress(searchId);
    } else {
      currentStatus = data.status; currentData = data; renderResults(data);
    }
    showToast('Etapa atualizada com sucesso!', 'success');
  } catch (e) { showToast(e.message, 'error'); }
  finally { hideLoading(); enableActions(); }
}

function renderPipelineStats(data) {
  const el = document.getElementById('pipelineStats');
  const s = data.summary || {};
  const queries = s.queries_total ?? 0;
  if (queries > 0) {
    const raw = s.raw_results ?? '?';
    const filtered = s.filtered_results ?? s.after_filter ?? '?';
    const total = s.total_results ?? 0;
    el.textContent = `🔄 ${queries} buscas → ${raw} bruto → ${filtered} filtrados → ${total} deduplicados`;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

// ─── Actions Bar ───

function renderActions(status, searchId, data) {
  const bar = document.getElementById('actionsBar');
  const s = (data && data.summary) || {};
  const analyzedCount = s.analyzed_count ?? 0;
  const totalToAnalyze = s.total_to_analyze ?? 0;
  let html = '';

  const steps = [
    { key: 'rediscover', label: '🔍 Redescobrir', cls: 'btn-enrich' },
    { key: 'enrich', label: '📋 Enriquecer CNPJs + Sites', cls: 'btn-enrich' },
    { key: 'score', label: '⭐ Calcular Scores', cls: 'btn-score' },
    { key: 'analyze-market', label: '📊 Análise Mercado (IA)', cls: 'btn-market' },
  ];
  for (const st of steps) {
    html += `<button class="btn-step ${st.cls}" onclick="rerunStepApi('${searchId}','${st.key}','${st.key}')">${st.label}</button>`;
  }

  const remaining = totalToAnalyze - analyzedCount;
  if (status === 'market_analyzed' || status === 'analyzing_leads' || status === 'analyzed') {
    const nextLabel = remaining > 0
      ? `🧠 Analisar próximo (${analyzedCount}/${totalToAnalyze} prontos)`
      : `🧠 Re-analisar leads`;
    html += `<button class="btn-step btn-leads" onclick="analyzeNextLead('${searchId}')">${nextLabel}</button>`;
    if (remaining > 1) {
      html += `<button class="btn-step btn-leads" onclick="analyzeAllLeads('${searchId}')" style="opacity:0.85">🚀 Analisar todos (${remaining} restantes)</button>`;
    }
  } else if (status === 'scored' || status === 'enriched' || status === 'discovery') {
    html += `<button class="btn-step btn-leads" onclick="rerunStepApi('${searchId}','analyze-leads','analyze-leads')">🧠 Analisar Leads (IA)</button>`;
  }

  html += `<div class="spacer"></div>`;
  html += `<button class="btn-run-pipeline" onclick="runAll('${searchId}')">🚀 Executar Tudo</button>`;
  bar.innerHTML = html;
}

// ─── Step Execution ───

async function runStep(searchId, step) {
  disableActions();
  showLoading('Processando...');
  const isRerun = currentStatus && STEPS.indexOf(step.split('-')[0]) <= STEPS.indexOf(currentStatus.replace('ing', '').replace('analyzing_leads', 'analyzed'));
  const msgs = {
    enrich: isRerun ? 'Atualizando enriquecimento...' : 'Enriquecendo dados (CNPJ + scraping)...',
    score: isRerun ? 'Atualizando scores...' : 'Calculando scores...',
    'analyze-market': isRerun ? 'Atualizando análise de mercado...' : 'Gerando análise de mercado (IA)...',
    'analyze-leads': isRerun ? 'Atualizando análise de leads...' : 'Analisando lead...'
  };
  setProgress(msgs[step] || 'Processando...');
  try {
    const data = await safeFetch(API + `/api/search/${searchId}/${step}`, { method: 'POST' });
    if (data.error) { showToast(data.error, 'error'); }
    else if (data.status === 'enriching') { await pollEnrichProgress(searchId); }
    else { currentStatus = data.status; currentData = data; renderResults(data); }
  } catch (e) { showToast(e.message, 'error'); }
  finally { hideLoading(); enableActions(); }
}

async function pollEnrichProgress(searchId) {
  let lastProgress = '';
  while (true) {
    try {
      const data = await safeFetch(API + '/api/search/' + searchId);
      if (data.error) break;
      const leads = data.leads || [];
      const enriched = leads.filter(l => l.enrichment_status && l.enrichment_status !== 'pending').length;
      const total = leads.length;
      const progress = `${enriched}/${total}`;
      if (progress !== lastProgress) {
        setProgress(`Enriquecendo dados... ${enriched}/${total} leads processados`);
        lastProgress = progress;
      }
      if (data.status !== 'enriching') {
        currentStatus = data.status; currentData = data; renderResults(data); return;
      }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 2000));
  }
}

// ─── Incremental Lead Analysis ───

async function analyzeNextLead(searchId) {
  disableActions();
  showLoading('Analisando lead...');
  let progress = await safeFetch(API + '/api/search/' + searchId);
  const s = progress.summary || {};
  const analyzed = s.analyzed_count ?? 0;
  const total = s.total_to_analyze ?? 0;
  setProgress(`Analisando lead ${analyzed + 1}/${total}...`);
  try {
    const data = await safeFetch(API + `/api/search/${searchId}/analyze-leads`, { method: 'POST' });
    if (data.error) showToast(data.error, 'error');
    else { currentStatus = data.status; currentData = data; renderResults(data); }
  } catch (e) { showToast(e.message, 'error'); }
  finally { hideLoading(); enableActions(); }
}

async function analyzeAllLeads(searchId) {
  disableActions();
  showLoading('Analisando todos os leads...');
  try {
    const data = await safeFetch(API + `/api/search/${searchId}/analyze-leads?all=true`, { method: 'POST' });
    if (data.error) { showToast(data.error, 'error'); }
    else if (data.status === 'analyzing_leads') { await pollAnalyzeLeadsProgress(searchId); }
    else { currentStatus = data.status; currentData = data; renderResults(data); }
  } catch (e) { showToast(e.message, 'error'); }
  finally { hideLoading(); enableActions(); }
}

async function pollAnalyzeLeadsProgress(searchId) {
  let lastCount = -1;
  while (true) {
    try {
      const data = await safeFetch(API + '/api/search/' + searchId);
      if (data.error) break;
      const s = data.summary || {};
      const analyzed = s.analyzed_count ?? 0;
      const total = s.total_to_analyze ?? 0;
      if (analyzed !== lastCount) {
        setProgress(`Analisando leads... ${analyzed}/${total}`);
        lastCount = analyzed;
        currentData = data; renderResults(data);
      }
      if (data.status === 'analyzed' || data.status !== 'analyzing_leads') {
        currentStatus = data.status; currentData = data; renderResults(data); return;
      }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 3000));
  }
}

// ─── Run All Pipeline Steps ───

async function runAll(searchId) {
  pipelineRunning = true;
  const steps = ['enrich', 'score', 'analyze-market', 'analyze-leads'];
  const msgs = {
    enrich: 'Enriquecendo dados...', score: 'Calculando scores...',
    'analyze-market': 'Gerando análise de mercado (IA)...', 'analyze-leads': 'Analisando leads...'
  };
  for (const step of steps) {
    if (!pipelineRunning) break;
    let current = await safeFetch(API + `/api/search/${searchId}`);
    currentStatus = current.status;
    const next = getNextStep(currentStatus);
    if (!next) break;
    const stepMap = { enrich: 'enrich', score: 'score', 'analyze-market': 'analyze-market', 'analyze-leads': 'analyze-leads' };
    if (stepMap[next] !== step) continue;
    disableActions();
    showLoading(msgs[step] || 'Processando...');
    setProgress(msgs[step] || 'Processando...');
    try {
      const data = await safeFetch(API + `/api/search/${searchId}/${step}`, { method: 'POST' });
      if (data.error) { showToast(data.error, 'error'); pipelineRunning = false; break; }
      if (data.status === 'enriching') {
        await pollEnrichProgress(searchId);
        const updated = await safeFetch(API + `/api/search/${searchId}`);
        currentStatus = updated.status; currentData = updated; renderResults(updated);
      } else if (data.status === 'analyzing_leads') {
        await pollAnalyzeLeadsProgress(searchId);
      } else {
        currentStatus = data.status; currentData = data; renderResults(data);
      }
    } catch (e) { showToast(e.message, 'error'); pipelineRunning = false; break; }
  }
  hideLoading();
  showToast('Pipeline concluída!', 'success');
  pipelineRunning = false;
}

// ─── Search (Discovery) ───

async function doSearch() {
  const niche = document.getElementById('niche').value.trim();
  const city = document.getElementById('city').value.trim();
  const state = document.getElementById('state').value;
  if (!niche || !city) { showToast('Preencha nicho e cidade', 'warning'); return; }
  document.getElementById('searchBtn').disabled = true;
  showLoading('Iniciando busca...');
  setProgress('');
  document.getElementById('results').style.display = 'none';
  try {
    const initData = await safeFetch(API + '/api/search', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({niche, city, state})
    });
    if (initData.error) { showToast(initData.error, 'error'); return; }
    currentSearchId = initData.search_id;
    await pollDiscoveryProgress(currentSearchId);
    showToast('Busca concluída!', 'success');
  } catch (e) { showToast(e.message, 'error'); }
  finally { hideLoading(); document.getElementById('searchBtn').disabled = false; }
}

async function pollDiscoveryProgress(searchId) {
  let lastDone = -1;
  while (true) {
    try {
      const data = await safeFetch(API + '/api/search/' + searchId);
      if (data.error) { showToast(data.error, 'error'); return; }
      const s = data.summary || {};
      const done = s.queries_done ?? 0;
      const total = s.queries_total || '?';
      const currentQ = s.current_query || '';
      if (done !== lastDone) {
        setProgress(`Busca ${done}/${total}... ${currentQ}`);
        lastDone = done;
      }
      if (data.status !== 'discovering') {
        currentStatus = data.status; currentData = data; renderResults(data); return;
      }
    } catch (e) {}
    await new Promise(r => setTimeout(r, 1000));
  }
}

// ─── Helpers ───

function findLead(leadId) {
  if (!currentData || !currentData.leads) return null;
  return currentData.leads.find(l => l.id === leadId);
}

function findLeadIndex(leadId) {
  if (!currentData || !currentData.leads) return -1;
  return currentData.leads.findIndex(l => l.id === leadId);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function reloadSearch() {
  if (!currentSearchId) return;
  const data = await safeFetch(API + '/api/search/' + currentSearchId);
  if (!data.error) { currentStatus = data.status; currentData = data; renderResults(data); }
}

function showLoading(text) {
  document.getElementById('loadingText').textContent = text || 'Carregando...';
  document.getElementById('loading').classList.add('show');
}
function setProgress(text) {
  document.getElementById('progressText').textContent = text || '';
}
function hideLoading() {
  document.getElementById('loading').classList.remove('show');
  document.getElementById('progressText').textContent = '';
}
function disableActions() {
  document.querySelectorAll('.actions-bar .btn-step, .actions-bar .btn-run-pipeline, .pipeline-bar .step-pill')
    .forEach(b => b.style.pointerEvents = 'none');
}
function enableActions() {
  document.querySelectorAll('.actions-bar .btn-step, .actions-bar .btn-run-pipeline, .pipeline-bar .step-pill')
    .forEach(b => b.style.pointerEvents = '');
}

// ─── Render ───

function renderResults(data) {
  const s = data.summary || {};
  const status = data.status || 'unknown';
  currentSearchId = s.search_id || data.search_id;
  currentStatus = status;
  currentData = data;
  document.getElementById('results').style.display = 'block';
  renderPipelineBar(status);
  renderPipelineStats(data);
  renderActions(status, s.search_id || data.search_id, data);

  const hasScore = status === 'scored' || status === 'market_analyzed' || status === 'analyzed' || status === 'analyzing_leads';
  const comSiteEmail = s.com_site_email || 0;
  const comSitePhone = s.com_site_phone || 0;
  const comYoutube = s.com_youtube || 0;
  const comTiktok = s.com_tiktok || 0;

  // Ensure all summary fields have defaults to avoid "undefined"
  const totalResults = s.total_results ?? 0;
  const comSite = s.com_site ?? 0;
  const semSite = s.sem_site ?? (totalResults - comSite);
  const pctSemSite = s.pct_sem_site ?? (totalResults ? Math.round((totalResults - comSite) / totalResults * 100) : 0);
  const comInstagram = s.com_instagram ?? 0;
  const comAds = s.com_ads ?? 0;
  const comMaps = s.com_maps ?? 0;
  const comCnpj = s.com_cnpj ?? 0;

  document.getElementById('summaryGrid').innerHTML = `
    <div class="stat-card purple"><div class="num">${totalResults}</div><div class="label">Empresas</div></div>
    <div class="stat-card blue"><div class="num">${comSite}</div><div class="label">Com Site</div></div>
    <div class="stat-card red"><div class="num">${semSite} (${pctSemSite}%)</div><div class="label">Sem Site</div></div>
    <div class="stat-card green"><div class="num">${comInstagram}</div><div class="label">Com Instagram</div></div>
    <div class="stat-card yellow"><div class="num">${comAds}</div><div class="label">Com Ads</div></div>
    <div class="stat-card teal"><div class="num">${comMaps}</div><div class="label">Com Maps</div></div>
    ${comCnpj > 0 ? `<div class="stat-card green"><div class="num">${comCnpj}</div><div class="label">Com CNPJ</div></div>` : ''}
    ${comSiteEmail > 0 ? `<div class="stat-card green"><div class="num">${comSiteEmail}</div><div class="label">Email no Site</div></div>` : ''}
    ${comSitePhone > 0 ? `<div class="stat-card blue"><div class="num">${comSitePhone}</div><div class="label">Tel no Site</div></div>` : ''}
    ${comYoutube > 0 ? `<div class="stat-card red"><div class="num">${comYoutube}</div><div class="label">YouTube</div></div>` : ''}
    ${comTiktok > 0 ? `<div class="stat-card purple"><div class="num">${comTiktok}</div><div class="label">TikTok</div></div>` : ''}
  `;

  // Market IA Analysis
  const iaMarket = s.ia_market_analysis || s.ia_analysis || '';
  if (iaMarket) {
    document.getElementById('iaMarketAnalysis').style.display = 'block';
    const mktEl = document.getElementById('iaMarketText');
    if (typeof iaMarket === 'object') {
      let mktHtml = '';
      if (iaMarket.resumo) mktHtml += `<div class="market-section"><div class="ms-label">Resumo</div><div class="ms-value">${esc(iaMarket.resumo)}</div></div>`;
      if (iaMarket.pontos_fracos && iaMarket.pontos_fracos.length) mktHtml += `<div class="market-section"><div class="ms-label">Pontos Fracos</div><ul style="margin:0;padding-left:18px;font-size:14px;line-height:1.8">${iaMarket.pontos_fracos.map(f => `<li>${esc(typeof f === 'string' ? f : f.ponto || JSON.stringify(f))}</li>`).join('')}</ul></div>`;
      if (iaMarket.oportunidades && iaMarket.oportunidades.length) mktHtml += `<div class="market-section"><div class="ms-label">Oportunidades</div><ul class="market-opp-list">${iaMarket.oportunidades.map(o => `<li><span class="opp-title">${esc(o.titulo || o.servico || '')}</span> <span class="opp-desc">${esc(o.descricao || '')}</span> ${o.potencial ? `<span class="opp-pot ${o.potencial === 'alto' ? 'alto' : o.potencial === 'medio' ? 'medio' : 'baixo'}">(${esc(o.potencial)})</span>` : ''}</li>`).join('')}</ul></div>`;
      if (iaMarket.estrategia_entrada) mktHtml += `<div class="market-section"><div class="ms-label">Estratégia de Entrada</div><div class="ms-value">${esc(iaMarket.estrategia_entrada)}</div></div>`;
      if (iaMarket.ticket_medio_estimado) mktHtml += `<div class="market-section"><div class="ms-label">Ticket Médio Estimado</div><div class="ms-value" style="font-weight:700;color:var(--success);font-size:18px">${esc(iaMarket.ticket_medio_estimado)}</div></div>`;
      if (iaMarket.concorrencia) mktHtml += `<div class="market-section"><div class="ms-label">Concorrência</div><div class="ms-value">${esc(iaMarket.concorrencia)}</div></div>`;
      if (!mktHtml) mktHtml = `<pre style="white-space:pre-wrap;font-size:13px">${esc(JSON.stringify(iaMarket, null, 2))}</pre>`;
      mktEl.innerHTML = mktHtml;
    } else {
      mktEl.textContent = iaMarket;
    }
  } else {
    document.getElementById('iaMarketAnalysis').style.display = 'none';
  }

  // Lead list
  const list = document.getElementById('leadList');

  if (leads.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">Nenhum lead encontrado</div><div class="empty-desc">Tente uma busca diferente ou ajuste os filtros.</div></div>`;

    const scoreHtml = showScore ? `<div class="lead-score ${scoreClass}">${score}/100</div>` : '';
    const leadId = l.id || `${s.search_id}_${i}`;

    const diagBadge = l.diagnostico ? '<span class="badge badge-diag">🔬 Diagnóstico</span>' : '';
    const analiseBadge = l.ia_analise ? '<span class="badge badge-analise">📋 Análise</span>' : '';

      l.site_tiktok ? '<span class="badge badge-tiktok">🎵 TikTok</span>' : '',
      l.enrichment_status ? `<span class="badge badge-enrich">🔍 ${l.enrichment_status === 'done' ? 'Enriquecido' : l.enrichment_status === 'partial' ? 'Parcial' : l.enrichment_status}</span>` : '',
      l.cnpj_source ? `<span class="badge badge-cnpj-src">📋 CNPJ: ${l.cnpj_source}</span>` : '',
      diagBadge, analiseBadge,
    ].filter(Boolean).join('');

    const detailRows = [
      l.cnpj ? `<dt>CNPJ</dt><dd>${l.cnpj}${l.cnpj_source ? ` <span style="color:var(--accent);font-size:11px">(${l.cnpj_source})</span>` : ''}</dd>` : '',

      l.situacao ? `<dt>Situação</dt><dd>${l.situacao}</dd>` : '',
      l.capital_social ? `<dt>Capital</dt><dd>R$${Number(l.capital_social).toLocaleString('pt-BR')}</dd>` : '',
      l.porte ? `<dt>Porte</dt><dd>${l.porte}</dd>` : '',
      l.cnae_descricao ? `<dt>Atividade</dt><dd>${l.cnae_descricao}</dd>` : '',
      l.data_inicio ? `<dt>Início</dt><dd>${l.data_inicio}</dd>` : '',
      l.opcao_pelo_mei !== undefined ? `<dt>MEI</dt><dd>${l.opcao_pelo_mei ? 'Sim' : 'Não'}</dd>` : '',
      l.site_url ? `<dt>Site</dt><dd><a href="${l.site_url}" target="_blank" rel="noopener">${l.site_url}</a></dd>` : '',
      l.instagram_url ? `<dt>Instagram</dt><dd><a href="${l.instagram_url}" target="_blank" rel="noopener">${l.instagram_url}</a></dd>` : '',
      l.site_instagram ? `<dt>IG no site</dt><dd><a href="${l.site_instagram}" target="_blank" rel="noopener">${l.site_instagram}</a></dd>` : '',
      l.site_facebook ? `<dt>FB no site</dt><dd><a href="${l.site_facebook}" target="_blank" rel="noopener">${l.site_facebook}</a></dd>` : '',
      l.site_youtube ? `<dt>YouTube</dt><dd><a href="${l.site_youtube}" target="_blank" rel="noopener">${l.site_youtube}</a></dd>` : '',
      l.site_tiktok ? `<dt>TikTok</dt><dd><a href="${l.site_tiktok}" target="_blank" rel="noopener">${l.site_tiktok}</a></dd>` : '',
      l.site_emails && l.site_emails.length ? `<dt>Emails no site</dt><dd>${l.site_emails.map(e => `<a href="mailto:${e}">${e}</a>`).join(', ')}</dd>` : '',
      l.site_phones && l.site_phones.length ? `<dt>Tels no site</dt><dd>${l.site_phones.join(', ')}</dd>` : '',
      l.maps_rating ? `<dt>Maps</dt><dd>${l.maps_rating}★ (${l.maps_reviews} reviews)</dd>` : '',
      (l.maps_phone || l.telefone_receita) ? `<dt>Telefone</dt><dd>${l.maps_phone || l.telefone_receita}</dd>` : '',
      l.email_receita ? `<dt>Email</dt><dd>${l.email_receita}</dd>` : '',
      l.socios ? `<dt>Sócios</dt><dd>${l.socios.join(', ')}</dd>` : '',
      l.enrichment_status ? `<dt>Enriquecimento</dt><dd>${l.enrichment_status === 'done' ? '✅ Completo' : l.enrichment_status === 'partial' ? '🟡 Parcial' : '⏳ Pendente'}</dd>` : '',
    ].filter(Boolean).join('');

    const iaHtml = l.ia_analise ? (() => {
      const a = l.ia_analise;
      if (typeof a === 'object') {
        let ah = `<div class="ia-lead" onclick="event.stopPropagation()"><strong>📋 Análise:</strong>`;
        if (a.resumo) ah += `<div class="analysis-field"><div class="af-label">Resumo</div><div class="af-value">${esc(a.resumo)}</div></div>`;
        if (a.presenca_digital) ah += `<div class="analysis-field"><div class="af-label">Presença Digital</div><div class="af-value">${esc(a.presenca_digital)}</div></div>`;
        if (a.posicao_mercado) ah += `<div class="analysis-field"><div class="af-label">Posição no Mercado</div><div class="af-value">${esc(a.posicao_mercado)}</div></div>`;
        if (a.publico_esperado) ah += `<div class="analysis-field"><div class="af-label">Público Esperado</div><div class="af-value">${esc(a.publico_esperado)}</div></div>`;
        if (a.observacoes) ah += `<div class="analysis-field"><div class="af-label">Observações</div><div class="af-value">${esc(a.observacoes)}</div></div>`;
        ah += `<div class="ia-actions" style="margin-top:8px"><button class="btn-reanalyze" onclick="reanalyzeLead(${i}, event)">🔄 Re-analisar</button></div></div>`;
        return ah;
      } else {
        return `<div class="ia-lead" onclick="event.stopPropagation()"><strong>📋 Análise:</strong><br><br>${a}<div class="ia-actions" style="margin-top:8px"><button class="btn-save" onclick="showAnalysisEditor('${leadId}', event)">✏️ Editar texto</button> <button class="btn-reanalyze" onclick="reanalyzeLead(${i}, event)">🔄 Re-analisar</button></div></div>`;
      }
    })() : '';

    return `<div class="lead-card" id="lead-${leadId}" role="listitem" onclick="this.classList.toggle('open')" tabindex="0" onkeydown="if(event.key==='Enter')this.classList.toggle('open')">
      <div class="lead-top">
        <div class="lead-name" style="cursor:pointer" onclick="openDiagModal('${leadId}', event)">${i+1}. ${l.title}</div>
        <div class="lead-actions">
          <button onclick="showEditForm('${leadId}', event)" title="Editar lead" aria-label="Editar lead">✏️</button>
          <button onclick="deleteLead('${leadId}', event)" title="Excluir lead" aria-label="Excluir lead" style="color:var(--error)">🗑️</button>
        </div>
        ${scoreHtml}
      </div>
      <div class="lead-badges">${badges}</div>
      <div class="lead-snippet">${l.snippet || ''}</div>
      ${detailRows || iaHtml ? `<div class="lead-detail">
        <div class="detail-grid">${detailRows}</div>
        ${iaHtml}
      </div>` : ''}
    </div>`;
  }).join('');

  loadHistory();
}

// ─── History ───

async function loadHistory() {
  try {
    const data = await safeFetch(API + '/api/history');
    const list = document.getElementById('historyList');
    if (!data.length) { list.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">Nenhuma busca ainda</div><div class="empty-desc">Comece buscando empresas por nicho e cidade.</div></div>'; return; }
    list.innerHTML = data.map(s => {
      const statusBadge = s.status ? `<span class="status-badge ${s.status}">${STEP_LABELS[s.status] || s.status}</span>` : '';
      return `<div class="history-item" role="listitem" tabindex="0" onclick="loadSearch('${s.search_id}')" onkeydown="if(event.key==='Enter')loadSearch('${s.search_id}')">
        <div class="hi-info">
          <div class="hi-niche">${s.niche || 'N/A'}</div>
          <div class="hi-location">${s.city || 'N/A'}-${s.state || 'N/A'} <span style="color:var(--text2)">(${s.total_results ?? 0} resultados)</span> ${statusBadge}</div>
        </div>
        <div class="hi-right">
          <div style="color:var(--text3);font-size:12px">${s.timestamp || ''}</div>
          <button class="btn-del-search" onclick="deleteSearch('${s.search_id}', event)" title="Excluir busca" aria-label="Excluir busca">🗑️</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) {}
}

function loadSearch(id) {
  safeFetch(API + '/api/search/' + id).then(data => {
    if (data.error) { showToast('Não encontrado', 'error'); return; }
    currentSearchId = id;
    currentStatus = data.status;
    currentData = data;
    renderResults(data);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
}

// ─── Diagnosis Modal ───

function openDiagModal(leadId, event) {
  if (event) event.stopPropagation();
  const l = findLead(leadId);
  if (!l) return;
  document.getElementById('diagModal').classList.add('show');
  document.getElementById('diagBody').innerHTML = '<div class="loading-diag"><div class="spinner"></div><p>Carregando diagnóstico...</p></div>';
  renderDiagModal(l);
  // Focus trap
  document.getElementById('diagModal').focus();
}

function closeDiagModal() {
  document.getElementById('diagModal').classList.remove('show');
}

document.getElementById('diagModal').addEventListener('click', function(e) {
  if (e.target === this) closeDiagModal();
});
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeDiagModal();
});

function renderDiagModal(l) {
  const s = currentData ? currentData.summary : {};
  const score = l.score || 0;
  const scoreClass = score >= 60 ? 'high' : score >= 30 ? 'mid' : 'low';
  const diag = l.diagnostico;
  const iaAnalise = l.ia_analise;

  let html = '';

  // Header
  html += `<div class="modal-header">
    <h2>${esc(l.title || 'Lead')}</h2>
    <div class="modal-badges">
      <div class="modal-score ${scoreClass}">${score}/100</div>
      ${l.tem_site ? '<span class="badge badge-site">🌐 Site</span>' : '<span class="badge badge-no">🚫 Sem Site</span>'}
      ${l.tem_instagram ? '<span class="badge badge-insta">📸 Instagram</span>' : '<span class="badge badge-no">🚫 Sem IG</span>'}
      ${l.tem_maps ? `<span class="badge badge-maps">📍 Maps ${l.maps_rating || ''}★</span>` : '<span class="badge badge-no">🚫 Sem Maps</span>'}
      ${l.tem_ads ? '<span class="badge badge-ads">💰 Ads</span>' : ''}
      ${l.cnpj ? '<span class="badge badge-site">📋 CNPJ</span>' : ''}
    </div>
  </div>`;

  // Dados Cadastrais
  const cadastroRows = [
    l.cnpj ? `<dt>CNPJ</dt><dd>${l.cnpj}${l.cnpj_source ? ` <span style="color:var(--accent);font-size:11px">(${l.cnpj_source})</span>` : ''}</dd>` : '',
    l.razao_social ? `<dt>Razão Social</dt><dd>${esc(l.razao_social)}</dd>` : '',
    l.situacao ? `<dt>Situação</dt><dd>${esc(l.situacao)}</dd>` : '',
    l.capital_social ? `<dt>Capital</dt><dd>R$${Number(l.capital_social).toLocaleString('pt-BR')}</dd>` : '',
    l.porte ? `<dt>Porte</dt><dd>${esc(l.porte)}</dd>` : '',
    l.cnae_descricao ? `<dt>Atividade</dt><dd>${esc(l.cnae_descricao)}</dd>` : '',
    (l.maps_phone || l.telefone_receita) ? `<dt>Telefone</dt><dd>${esc(l.maps_phone || l.telefone_receita)}</dd>` : '',
    (l.site_phones && l.site_phones.length) ? `<dt>Tel no site</dt><dd>${l.site_phones.map(p => esc(p)).join(', ')}</dd>` : '',
    (l.email_receita || (l.site_emails && l.site_emails.length)) ? `<dt>Email</dt><dd>${esc(l.email_receita || (l.site_emails || []).join(', '))}</dd>` : '',
    l.site_url ? `<dt>Site</dt><dd><a href="${esc(l.site_url)}" target="_blank" rel="noopener">${esc(l.site_url)}</a></dd>` : '',
    l.instagram_url ? `<dt>Instagram</dt><dd><a href="${esc(l.instagram_url)}" target="_blank" rel="noopener">${esc(l.instagram_url)}</a></dd>` : '',
    (l.facebook_url || l.site_facebook) ? `<dt>Facebook</dt><dd><a href="${esc(l.facebook_url || l.site_facebook)}" target="_blank" rel="noopener">${esc(l.facebook_url || l.site_facebook)}</a></dd>` : '',
    l.maps_address ? `<dt>Endereço</dt><dd>${esc(l.maps_address)}</dd>` : '',
    l.data_inicio ? `<dt>Início Atividade</dt><dd>${l.data_inicio}</dd>` : '',
    l.socios ? `<dt>Sócios</dt><dd>${l.socios.map(s => esc(s)).join(', ')}</dd>` : '',
  ].filter(Boolean).join('');

  if (cadastroRows) {
    html += `<div class="modal-section"><h3>📋 Dados Cadastrais</h3><div class="modal-cadastro">${cadastroRows}</div></div>`;
  }

  // Análise
  if (iaAnalise) {
    html += '<div class="modal-section"><h3>📋 Análise</h3>';
    if (typeof iaAnalise === 'object') {
      const fields = [
        ['Resumo', iaAnalise.resumo],
        ['Presença Digital', iaAnalise.presenca_digital],
        ['Posição no Mercado', iaAnalise.posicao_mercado],
        ['Público Esperado', iaAnalise.publico_esperado],
        ['Observações', iaAnalise.observacoes],
      ];
      for (const [label, val] of fields) {
        if (val) html += `<div class="analysis-field"><div class="af-label">${label}</div><div class="af-value">${esc(val)}</div></div>`;
      }
    } else {
      html += `<div class="ia-lead">${esc(String(iaAnalise))}</div>`;
    }
    html += `<div style="margin-top:10px"><button class="btn btn-secondary btn-sm" onclick="reanalyzeLead(${findLeadIndex(l.id)}, event)">🔄 Re-analisar</button></div>`;
    html += '</div>';
  }

  // Diagnóstico
  html += '<div class="modal-section"><h3>🔬 Diagnóstico</h3>';

  if (diag) {
    if (diag.pontos_fracos && diag.pontos_fracos.length) {
      html += `<h4 style="color:var(--error);margin:12px 0 6px">🔴 Pontos Fracos</h4>`;
      for (const f of diag.pontos_fracos) {
        if (typeof f === 'object') {
          html += `<div class="diag-fracos-card"><div class="dfc-ponto">${esc(f.ponto)}</div>`;
          if (f.impacto) html += `<div class="dfc-detail"><span>⚡ Impacto: ${esc(f.impacto)}</span></div>`;
          if (f.solucao) html += `<div class="dfc-solucao">💡 ${esc(f.solucao)}</div>`;
          html += '</div>';
        } else {
          html += `<ul style="margin:0;padding-left:18px"><li style="padding:4px 0">${esc(f)}</li></ul>`;
        }
      }
    }
    if (diag.pontos_fortes && diag.pontos_fortes.length) {
      html += `<h4 style="color:var(--success);margin:12px 0 6px">🟢 Pontos Fortes</h4>`;
      for (const f of diag.pontos_fortes) {
        if (typeof f === 'object') {
          html += `<div class="diag-fortes-card"><div class="dfc-ponto">${esc(f.ponto)}</div>`;
          if (f.como_aproveitar) html += `<div class="dfc-como">💡 ${esc(f.como_aproveitar)}</div>`;
          html += '</div>';
        } else {
          html += `<ul style="margin:0;padding-left:18px"><li style="padding:4px 0">${esc(f)}</li></ul>`;
        }
      }
    }
    const opp = diag.oportunidade_principal;
    if (opp && typeof opp === 'object' && (opp.servico || opp.investimento || opp.retorno_esperado || opp.prazo_resultado)) {
      html += `<div class="opp-principal-card"><div class="opp-title">🎯 ${esc(opp.servico || 'Oportunidade')}</div><div class="opp-details">`;
      if (opp.investimento) html += `<div class="opp-item"><div class="oi-label">Investimento</div><div class="oi-value">${esc(opp.investimento)}</div></div>`;
      if (opp.retorno_esperado) html += `<div class="opp-item"><div class="oi-label">Retorno Esperado</div><div class="oi-value">${esc(opp.retorno_esperado)}</div></div>`;
      if (opp.prazo_resultado) html += `<div class="opp-item"><div class="oi-label">Prazo</div><div class="oi-value">${esc(opp.prazo_resultado)}</div></div>`;
      html += '</div></div>';
    } else if (diag.oportunidades && diag.oportunidades.length) {
      html += `<h4 style="margin:12px 0 6px">🎯 Oportunidades</h4><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px">${diag.oportunidades.map(o => `<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px"><div style="font-weight:600;font-size:14px">${esc(o.servico)}</div><div style="font-size:12px;color:var(--text2)"><span>💰 ${esc(o.investimento_estimado)}</span> <span>📈 ${esc(o.retorno_estimado)}</span> <span>⏱️ ${esc(o.prazo)}</span></div></div>`).join('')}</div>`;
    }
    if (diag.urgencia) {
      const urgClass = diag.urgencia === 'alta' ? 'alta' : diag.urgencia === 'media' ? 'media' : 'baixa';
      const urgLabel = diag.urgencia === 'alta' ? '🔴 Alta' : diag.urgencia === 'media' ? '🟡 Média' : '🟢 Baixa';
      html += `<h4 style="margin:12px 0 6px">⏰ Urgência</h4><span class="urgency-badge ${urgClass}">${urgLabel}</span>`;
      if (diag.razao_urgencia || diag.urgencia_motivo) {
        html += `<p style="color:var(--text2);font-size:13px;margin-top:4px">${esc(diag.razao_urgencia || diag.urgencia_motivo)}</p>`;
      }
    }
    const waMsg = diag.abordagem_whatsapp || diag.abordagem_sugerida || '';
    if (waMsg) {
      const waPhone = l.maps_phone || l.telefone_receita || '';
      const waLink = waPhone ? `https://wa.me/55${waPhone.replace(/\D/g, '')}?text=${encodeURIComponent(waMsg)}` : null;
      html += `<h4 style="margin:12px 0 6px">💬 Abordagem WhatsApp</h4><div class="diag-abordagem">`;
      html += `<button class="copy-btn" onclick="copyWhatsAppMsg('${esc(waPhone)}', this)">📋 Copiar WhatsApp</button>`;
      if (waLink) html += ` <a href="${waLink}" target="_blank" rel="noopener" class="copy-btn" style="text-decoration:none;left:auto">📲 Abrir no WhatsApp</a>`;
      html += `${esc(waMsg)}</div>`;
    }
    if (diag.estimativa_receita) {
      html += `<h4 style="margin:12px 0 6px">💰 Estimativa de Receita</h4><div class="diag-receita">${esc(diag.estimativa_receita)}</div>`;
    }
    html += `<div style="margin-top:10px"><button class="btn btn-secondary btn-sm" onclick="generateDiagnosis('${l.id}')" style="background:rgba(99,102,241,0.15);border:1px solid var(--brand-500)">🔄 Re-diagnosticar</button></div>`;
  } else {
    html += `<button class="diag-generate-btn" id="diagGenBtn" onclick="generateDiagnosis('${l.id}')">🔬 Gerar Diagnóstico</button>`;
  }

  html += '</div>'; // close diagnóstico section

  // Actions
  const phone = l.maps_phone || l.telefone_receita || '';
  const waLink = phone ? `https://wa.me/55${phone.replace(/\D/g, '')}` : '#';
  html += `<div class="modal-actions">
    <button class="btn-action" onclick="showEditForm('${l.id}', event); closeDiagModal();">✏️ Editar</button>
    ${phone ? `<a href="${waLink}" target="_blank" rel="noopener" class="btn-action">💬 WhatsApp</a>` : ''}
    <button class="btn-action danger" onclick="deleteLead('${l.id}', event); closeDiagModal();">🗑️ Excluir</button>
  </div>`;

  document.getElementById('diagBody').innerHTML = html;
}

async function generateDiagnosis(leadId) {
  const btn = document.getElementById('diagGenBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Gerando diagnóstico...'; }
  document.getElementById('diagBody').innerHTML = '<div class="loading-diag"><div class="spinner"></div><p>Gerando diagnóstico com IA... (pode levar ~90s)</p></div>';
  try {
    const data = await safeFetch(API + `/api/search/${currentSearchId}/diagnose/${leadId}`, { method: 'POST' });
    if (data.error) {
      showToast(data.error, 'error');
      const l = findLead(leadId);
      if (l) renderDiagModal(l);
      return;
    }
    await reloadSearch();
    const l = findLead(leadId);
    if (l) renderDiagModal(l);
    showToast('Diagnóstico gerado!', 'success');
  } catch (e) {
    showToast(e.message, 'error');
    const l = findLead(leadId);
    if (l) renderDiagModal(l);
  }
}

function copyWhatsAppMsg(phone, btn) {
  const diagBody = btn.closest('.diag-abordagem');
  if (!diagBody) return;
  const clone = diagBody.cloneNode(true);
  clone.querySelector('.copy-btn')?.remove();
  const msg = clone.textContent.trim();
  if (phone) {
    const cleanPhone = phone.replace(/\D/g, '');
    const waUrl = `https://wa.me/55${cleanPhone}?text=${encodeURIComponent(msg)}`;
    window.open(waUrl, '_blank');
  } else {
    navigator.clipboard.writeText(msg).then(() => {
      btn.textContent = '✅ Copiado!';
      setTimeout(() => { btn.textContent = '📋 Copiar WhatsApp'; }, 2000);
    });
  }
}

loadHistory();

// Enter key on search fields
document.getElementById('niche').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
document.getElementById('city').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
